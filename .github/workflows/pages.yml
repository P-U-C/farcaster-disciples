name: Refresh and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/index.json"
      - "data/identity-cache.json"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: Rescan Farcaster identity links
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      should_deploy: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh index
        shell: bash
        run: |
          if [[ "${{ inputs.discover }}" == "true" || "$(date -u +%u)" == "7" ]]; then
            npm run index:discover
          else
            npm run index
          fi

      - name: Verify
        run: npm run verify

      - name: Commit refreshed public data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data/index.json data/identity-cache.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/index.json data/identity-cache.json
          git commit -m "data: refresh continuity index [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
